# Configuración de deployment para Netlify
[build]
  command = "npm run build"
  publish = "dist"

# Headers para optimización de performance y SEO
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Compresión para mejor performance
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"

# Cache de assets estáticos por 1 año
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para imágenes optimizadas
[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache de CSS/JS por 1 mes
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2628000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2628000"

# Redirects para SPA behavior si fuera necesario
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200